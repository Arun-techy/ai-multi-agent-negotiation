<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NegoSim — Welcome</title>
  <meta name="description" content="Sign in to NegoSim — AI-powered multi-agent negotiation platform." />

  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/login.css" />
  <script src="js/config.js"></script>

  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

  <!-- ══ Background layers ══ -->
  <div class="login-bg" aria-hidden="true"></div>
  <div class="login-streaks" aria-hidden="true"></div>
  <div class="login-beam login-beam--1" aria-hidden="true"></div>
  <div class="login-beam login-beam--2" aria-hidden="true"></div>
  <div class="login-beam login-beam--3" aria-hidden="true"></div>

  <div class="login-page">

    <!-- ═══ LEFT: HUD Illustration ═══ -->
    <div class="login-illustration login-entrance-card" aria-hidden="true">
      <div class="hud-scene" id="hud-scene">
        <div class="hud-glow"></div>
        <div class="hud-card-wrapper" id="hud-card-wrapper">
          <div class="hud-card" id="hud-card">
            <!-- SVG injected by login-scene.js -->
          </div>
          <div class="hud-connectors" id="hud-connectors">
            <!-- Pills injected by login-scene.js -->
          </div>
        </div>
      </div>
    </div>

    <!-- ═══ RIGHT: Form Column ═══ -->
    <div class="login-form-side">
      <div class="login-form-container login-entrance-form">

        <!-- Brand -->
        <div class="login-brand">
          <div class="login-brand-mark">N</div>
          <div class="login-brand-text">NegoSim</div>
        </div>

        <!-- Title (dynamic) -->
        <h1 class="login-title" id="auth-title">Sign In</h1>

        <!-- Message banner -->
        <div class="login-message" id="auth-message">
          <span id="auth-message-icon"></span>
          <span id="auth-message-text"></span>
        </div>

        <!-- Google button -->
        <button type="button" class="login-google-btn" id="btn-google-login">
          <svg viewBox="0 0 24 24" width="18" height="18" style="display:inline-block">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
          </svg>
          Continue with Google
        </button>

        <!-- Divider -->
        <div class="login-divider">
          <div class="login-divider-line"></div>
          <span class="login-divider-text">Or</span>
          <div class="login-divider-line"></div>
        </div>

        <!-- ═══ LOGIN FORM ═══ -->
        <form id="form-login" class="login-form" autocomplete="on">
          <div class="login-form-group">
            <div class="login-input-wrap">
              <svg class="login-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="4" width="20" height="16" rx="2"/>
                <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
              </svg>
              <input class="login-input" type="email" id="login-email" name="email" placeholder="Email Address" required autocomplete="email" />
              <label class="sr-only" for="login-email">Email Address</label>
            </div>
          </div>

          <div class="login-form-group">
            <div class="login-input-wrap">
              <svg class="login-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
              <input class="login-input" type="password" id="login-password" name="password" placeholder="Password" required autocomplete="current-password" />
              <label class="sr-only" for="login-password">Password</label>
              <button type="button" class="login-pw-toggle" id="login-pw-toggle" aria-label="Toggle password visibility">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>
          </div>

          <button type="submit" class="login-submit" id="btn-login">
            <span class="login-spinner"></span>
            <span class="login-btn-text">Sign In</span>
          </button>

          <div class="login-forgot-notice">Password reset isn't available yet.</div>
        </form>

        <!-- ═══ REGISTER FORM ═══ -->
        <form id="form-register" class="login-form" autocomplete="on" hidden>
          <div class="login-form-group">
            <div class="login-input-wrap">
              <svg class="login-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
              </svg>
              <input class="login-input" type="text" id="register-name" name="name" placeholder="Full Name" required autocomplete="name" />
              <label class="sr-only" for="register-name">Full Name</label>
            </div>
          </div>

          <div class="login-form-group">
            <div class="login-input-wrap">
              <svg class="login-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="4" width="20" height="16" rx="2"/>
                <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
              </svg>
              <input class="login-input" type="email" id="register-email" name="email" placeholder="Email Address" required autocomplete="email" />
              <label class="sr-only" for="register-email">Email Address</label>
            </div>
          </div>

          <div class="login-form-group">
            <div class="login-input-wrap">
              <svg class="login-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
              <input class="login-input" type="password" id="register-password" name="password" placeholder="Password (min 8 characters)" required autocomplete="new-password" minlength="8" />
              <label class="sr-only" for="register-password">Password (min 8 characters)</label>
              <button type="button" class="login-pw-toggle" id="register-pw-toggle" aria-label="Toggle password visibility">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>
            <!-- Password Strength -->
            <div class="login-pw-strength" id="pw-strength">
              <div class="login-pw-strength-bar" id="pw-bar-1"></div>
              <div class="login-pw-strength-bar" id="pw-bar-2"></div>
              <div class="login-pw-strength-bar" id="pw-bar-3"></div>
              <div class="login-pw-strength-bar" id="pw-bar-4"></div>
            </div>
          </div>

          <div class="login-form-group">
            <div class="login-input-wrap">
              <svg class="login-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
              <input class="login-input" type="password" id="register-confirm-password" name="confirm-password" placeholder="Confirm Password" required autocomplete="new-password" minlength="8" />
              <label class="sr-only" for="register-confirm-password">Confirm Password</label>
            </div>
          </div>

          <button type="submit" class="login-submit" id="btn-register">
            <span class="login-spinner"></span>
            <span class="login-btn-text">Create Account</span>
          </button>
        </form>

        <!-- Toggle link (reference style) -->
        <div class="login-toggle" id="login-toggle">
          <span id="toggle-question">Don't have an account?</span>
          <button type="button" id="toggle-action">Sign Up here</button>
        </div>

      </div>
    </div>

  </div>

  <!-- Accessibility: screen-reader-only labels -->
  <style>.sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);border:0;white-space:nowrap;}</style>

  <!-- ═══ Auth Logic (preserved from original) ═══ -->
  <script>
    (() => {
      'use strict';

      // ── API Base (from config.js) ──
      const API_BASE = window.NegoSimConfig.API_BASE;

      // ── Token storage (localStorage, with graceful fallback) ──
      function storeToken(token) {
        try { localStorage.setItem('negosim_token', token); } catch (e) {
          try { sessionStorage.setItem('negosim_token', token); } catch (_) {}
        }
      }
      function getToken() {
        try { return localStorage.getItem('negosim_token') || sessionStorage.getItem('negosim_token'); } catch (_) { return null; }
      }
      function clearToken() {
        try { localStorage.removeItem('negosim_token'); localStorage.removeItem('negosim_user'); } catch (_) {}
        try { sessionStorage.removeItem('negosim_token'); sessionStorage.removeItem('negosim_user'); } catch (_) {}
      }
      function storeUser(user) {
        try { localStorage.setItem('negosim_user', JSON.stringify(user)); } catch (_) {
          try { sessionStorage.setItem('negosim_user', JSON.stringify(user)); } catch (_) {}
        }
      }

      // ── Server wake-up ping ──
      let _serverWakeMsgShown = false;
      let _wakeTimer = null;

      function pingServer() {
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 60000);

        _wakeTimer = setTimeout(() => {
          if (!_serverWakeMsgShown) {
            _serverWakeMsgShown = true;
            showMessage('info', 'Server is waking up, please wait… This can take up to 30 seconds on the first visit.');
          }
        }, 4000);

        fetch(`${API_BASE}/health`, { signal: controller.signal })
          .then(() => {
            clearTimeout(timeout);
            clearTimeout(_wakeTimer);
            if (_serverWakeMsgShown) {
              _serverWakeMsgShown = false;
              showMessage('success', 'Server is ready!');
              setTimeout(() => { authMessage.className = 'login-message'; }, 2500);
            }
          })
          .catch(() => {
            clearTimeout(timeout);
            clearTimeout(_wakeTimer);
          });
      }

      // ── Redirect Check ──
      const existingToken = getToken();
      if (existingToken) {
        if (existingToken === 'mock-token-fallback') {
          window.location.href = 'app.html';
        } else {
          fetch(`${API_BASE}/auth/me`, { headers: { 'Authorization': `Bearer ${existingToken}` }})
          .then(r => r.ok ? window.location.href = 'app.html' : clearToken())
          .catch(() => clearToken());
        }
      }

      // Ping server to wake it up on page load
      pingServer();

      // ── DOM refs ──
      const formLogin = document.getElementById('form-login');
      const formRegister = document.getElementById('form-register');
      const authTitle = document.getElementById('auth-title');
      const authMessage = document.getElementById('auth-message');
      const toggleQuestion = document.getElementById('toggle-question');
      const toggleAction = document.getElementById('toggle-action');

      let currentMode = 'login';

      // ── Tab/Mode Switching (crossfade) ──
      function switchTab(tab) {
        authMessage.className = 'login-message'; // hide messages
        currentMode = tab;
        if (tab === 'login') {
          formLogin.removeAttribute('hidden');
          formRegister.setAttribute('hidden', '');
          authTitle.textContent = 'Sign In';
          toggleQuestion.textContent = "Don't have an account?";
          toggleAction.textContent = 'Sign Up here';
        } else {
          formRegister.removeAttribute('hidden');
          formLogin.setAttribute('hidden', '');
          authTitle.textContent = 'Create Account';
          toggleQuestion.textContent = 'Already have an account?';
          toggleAction.textContent = 'Sign in';
        }
      }

      toggleAction.addEventListener('click', () => {
        switchTab(currentMode === 'login' ? 'register' : 'login');
      });

      // ── Password Visibility ──
      function setupPwToggle(btnId, inputId) {
        document.getElementById(btnId).addEventListener('click', function() {
          const input = document.getElementById(inputId);
          const isPw = input.type === 'password';
          input.type = isPw ? 'text' : 'password';
          this.innerHTML = isPw 
            ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>`
            : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`;
        });
      }
      setupPwToggle('login-pw-toggle', 'login-password');
      setupPwToggle('register-pw-toggle', 'register-password');

      // ── Password Strength ──
      const regPw = document.getElementById('register-password');
      regPw.addEventListener('input', () => {
        const val = regPw.value;
        let score = 0;
        if (val.length >= 8) score++;
        if (/[A-Z]/.test(val) && /[a-z]/.test(val)) score++;
        if (/\d/.test(val)) score++;
        if (/[^A-Za-z0-9]/.test(val)) score++;
        
        const classes = ['', 'weak', 'fair', 'good', 'strong'];
        for (let i = 1; i <= 4; i++) {
          const bar = document.getElementById(`pw-bar-${i}`);
          bar.className = 'login-pw-strength-bar';
          if (val.length > 0 && i <= score) {
            bar.classList.add('active', classes[score]);
          }
        }
      });

      // ── Message Helper ──
      function showMessage(type, text) {
        authMessage.className = `login-message show ${type}`;
        document.getElementById('auth-message-icon').textContent = 
          type === 'error' ? '✕' : type === 'success' ? '✓' : 'ℹ';
        document.getElementById('auth-message-text').textContent = text;
      }

      // ── Friendly error messages ──
      function friendlyError(err, status) {
        if (!navigator.onLine) return 'No internet connection. Please check your network.';
        if (err.name === 'AbortError' || err.message?.includes('abort')) return 'Request timed out. The server may be slow — please try again.';
        if (err.message?.includes('Failed to fetch') || err.message?.includes('NetworkError')) {
          return 'Cannot reach the server. It may be starting up — please wait 30 seconds and try again.';
        }
        if (status === 409) return 'An account with this email already exists. Try signing in instead.';
        if (status === 401) return 'Incorrect email or password. Please try again.';
        if (status === 429) return 'Too many attempts. Please wait a few minutes before trying again.';
        if (status === 400) return err.message || 'Please check your inputs and try again.';
        if (status >= 500) return 'Server error. Please try again in a moment.';
        return err.message || 'Something went wrong. Please try again.';
      }

      // ── Generic auth fetch with timeout + one retry ──
      async function authFetch(url, options, retried = false) {
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 60000); // 60s timeout

        try {
          const res = await fetch(url, { ...options, signal: controller.signal });
          clearTimeout(timeout);
          return res;
        } catch (err) {
          clearTimeout(timeout);
          // Retry once on network failure (not on abort)
          if (!retried && err.name !== 'AbortError') {
            await new Promise(r => setTimeout(r, 2000)); // wait 2s before retry
            return authFetch(url, options, true);
          }
          throw err;
        }
      }

      // ── Form Submissions ──
      formLogin.addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('btn-login');
        btn.classList.add('loading');
        btn.disabled = true;
        authMessage.className = 'login-message';

        const email = document.getElementById('login-email').value.trim();
        const password = document.getElementById('login-password').value;

        if (!email || !password) {
          showMessage('error', 'Please fill in all fields.');
          btn.classList.remove('loading'); btn.disabled = false;
          return;
        }

        // Show wakeup notice if request takes a while
        const wakeNotice = setTimeout(() => {
          showMessage('info', 'Server is waking up, please wait…');
        }, 4000);

        let status = 0;
        try {
          const res = await authFetch(`${API_BASE}/auth/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
          });
          clearTimeout(wakeNotice);
          status = res.status;
          const data = await res.json();
          if (!res.ok) throw new Error(data.error?.message || 'Login failed');
          
          storeToken(data.token);
          storeUser(data.user);
          showMessage('success', 'Success! Redirecting…');
          setTimeout(() => window.location.href = 'app.html', 700);
        } catch (err) {
          clearTimeout(wakeNotice);
          showMessage('error', friendlyError(err, status));
          btn.classList.remove('loading');
          btn.disabled = false;
        }
      });

      formRegister.addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('btn-register');
        btn.classList.add('loading');
        btn.disabled = true;
        authMessage.className = 'login-message';

        const name     = document.getElementById('register-name').value.trim();
        const email    = document.getElementById('register-email').value.trim();
        const password = document.getElementById('register-password').value;
        const confirm  = document.getElementById('register-confirm-password').value;

        // Front-end validation
        if (!name || !email || !password || !confirm) {
          showMessage('error', 'Please fill in all fields.');
          btn.classList.remove('loading'); btn.disabled = false;
          return;
        }
        if (password.length < 8) {
          showMessage('error', 'Password must be at least 8 characters.');
          btn.classList.remove('loading'); btn.disabled = false;
          return;
        }
        if (password !== confirm) {
          showMessage('error', 'Passwords do not match.');
          btn.classList.remove('loading'); btn.disabled = false;
          return;
        }

        const wakeNotice = setTimeout(() => {
          showMessage('info', 'Server is waking up, please wait…');
        }, 4000);

        let status = 0;
        try {
          const res = await authFetch(`${API_BASE}/auth/register`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, email, password })
          });
          clearTimeout(wakeNotice);
          status = res.status;
          const data = await res.json();
          if (!res.ok) throw new Error(data.error?.message || 'Registration failed');
          
          storeToken(data.token);
          storeUser(data.user);
          showMessage('success', 'Account created! Redirecting…');
          setTimeout(() => window.location.href = 'app.html', 700);
        } catch (err) {
          clearTimeout(wakeNotice);
          showMessage('error', friendlyError(err, status));
          btn.classList.remove('loading');
          btn.disabled = false;
        }
      });

      // ── Google OAuth ──
      setTimeout(() => {
        if (window.google?.accounts) {
          google.accounts.id.initialize({
            client_id: '', // Add your Google Client ID here when you have one
            callback: async (googleRes) => {
              let status = 0;
              try {
                const res = await authFetch(`${API_BASE}/auth/google`, {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({ credential: googleRes.credential })
                });
                status = res.status;
                const data = await res.json();
                if (!res.ok) throw new Error(data.error?.message || 'Google login failed');
                
                storeToken(data.token);
                storeUser(data.user);
                showMessage('success', 'Logged in via Google! Redirecting…');
                setTimeout(() => window.location.href = 'app.html', 700);
              } catch (err) {
                showMessage('error', friendlyError(err, status));
              }
            }
          });
        }
      }, 500);

      document.getElementById('btn-google-login').addEventListener('click', () => {
        if (window.google?.accounts) {
          google.accounts.id.prompt((n) => {
            if (n.isNotDisplayed() || n.isSkippedMoment()) {
              showMessage('error', 'Google Sign-In is not configured yet. Please use email/password.');
            }
          });
        } else {
          showMessage('error', 'Google Sign-In is not available. Please use email and password.');
        }
      });

    })();
  </script>

  <!-- HUD illustration scene (after DOM) -->
  <script src="js/login-scene.js"></script>

</body>
</html>
